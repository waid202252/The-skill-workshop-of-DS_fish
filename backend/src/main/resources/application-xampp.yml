# 使用 XAMPP 自带的 MariaDB（本机实测：MariaDB 10.4.32 / 端口 3316 / root 空密码）
#
# 为什么单独一个 profile 而不是直接改 prod：
#   XAMPP 装的是 MariaDB 不是 Oracle MySQL，方言用 MariaDBDialect 更准确，
#   端口也常常不是默认 3306（本机因为 3306 被另一个 MySQL 占用，XAMPP 改成了 3316）。
#
# 启动：
#   java -jar target/im-server-1.0.0.jar --spring.profiles.active=xampp
#   mvn spring-boot:run -Dspring-boot.run.profiles=xampp
#
# 建库（只需一次）：
#   mysql -h127.0.0.1 -P3316 -uroot -e "CREATE DATABASE IF NOT EXISTS weliao DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
#
# 表结构由 Flyway 在启动时自动创建/升级（db/migration），Hibernate 只做校验（ddl-auto=validate）。

spring:
  datasource:
    url: jdbc:mysql://${XAMPP_HOST:127.0.0.1}:${XAMPP_PORT:3316}/${MYSQL_DB:weliao}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${XAMPP_USER:root}
    password: ${XAMPP_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    # MariaDB 用 MariaDBDialect；如果换回 Oracle MySQL 请改成 MySQLDialect
    database-platform: org.hibernate.dialect.MariaDBDialect
