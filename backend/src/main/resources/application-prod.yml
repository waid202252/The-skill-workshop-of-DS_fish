# 生产环境：MySQL 8+ / 9+
# 启动: java -jar im-server.jar --spring.profiles.active=prod
# 先建库: CREATE DATABASE weliao DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:weliao}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect

# 容器部署时后端前面是 nginx，可以信任它写入的 X-Forwarded-For
app:
  rate-limit:
    trust-forwarded-for: true
