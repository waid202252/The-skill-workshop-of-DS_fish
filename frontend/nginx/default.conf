# 微聊前端：静态资源托管 + 反向代理
# 浏览器只访问这一个端口，/api 与 /ws 由 nginx 转发给后端容器，天然同源，无跨域。

# UPSTREAM 用连字符而不是下划线：Tomcat 会拒绝含下划线的 Host 头
# （报 "The character [_] is never valid in a domain name" 并返回 400）
upstream weliao-backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;   # 与后端 20MB 上传上限留出余量

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带 hash 的静态资源可以长缓存
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存：发布新版本后浏览器必须重新拿 index，
    # 否则会继续引用上一版的 hash 资源，看起来像“改了没生效”。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # 上传文件由后端提供
    location /uploads/ {
        proxy_pass http://weliao-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://weliao-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket：必须显式转发 Upgrade，否则握手失败
    location /ws {
        proxy_pass http://weliao-backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 长连接心跳 25s，读超时要显著大于它
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 运维探活（只在容器网络内可见，不对外暴露后端端口）
    location /actuator/health {
        proxy_pass http://weliao-backend;
        # 这条必须有：不设的话 nginx 会把 upstream 名当成 Host 发过去
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA 路由回退：刷新 /login 这类路由不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
